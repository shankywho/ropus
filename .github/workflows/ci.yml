name: Continuous Integration & Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-verification:
    name: Backend Test, Race & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Dependencies
        run: |
          cd backend
          go mod verify

      - name: Static Analysis (go vet)
        run: |
          cd backend
          go vet ./...

      - name: Unit & Race Detection Tests
        run: |
          cd backend
          go test -race -count=1 -timeout=180s ./...

      - name: Benchmark Performance Suite
        run: |
          cd backend
          go test -bench=. -benchmem -run=^$ ./internal/riskengine/...
