name: ROPUS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Go Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run Go Tests & Race Detector
        run: |
          cd backend
          go test -race -v ./...

  ml-tests:
    name: Python ML & Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt
          pip install pytest joblib xgboost scikit-learn pandas numpy onnxruntime

      - name: Run Pytest
        run: |
          pytest ml-service/tests

      - name: Verify Frozen Holdout Evaluation
        run: |
          python ml-service/evaluation/evaluate_frozen_holdout.py

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Production Build
        run: |
          cd frontend
          npm run build

  docs-and-compose:
    name: Docker Compose & Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Documentation Files
        run: |
          make docs-check
