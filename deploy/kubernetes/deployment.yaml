apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-backend
  namespace: risk-engine
  labels:
    app.kubernetes.io/name: risk-backend
    app.kubernetes.io/part-of: ai-risk-manager
    app.kubernetes.io/component: api-engine
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-backend
        app.kubernetes.io/part-of: ai-risk-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: risk-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: risk-backend
          image: risk-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: risk-backend-config
            - secretRef:
                name: risk-backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: state-volume
              mountPath: /app/state
            - name: artifacts-volume
              mountPath: /app/artifacts
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: state-volume
          emptyDir: {}
        - name: artifacts-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
