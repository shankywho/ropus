apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: risk-backend-ingress
  namespace: risk-engine
  labels:
    app.kubernetes.io/name: risk-backend
    app.kubernetes.io/part-of: ai-risk-manager
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - risk-api.ropus.internal
      secretName: risk-backend-tls-secret
  rules:
    - host: risk-api.ropus.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: risk-backend-svc
                port:
                  number: 8080
