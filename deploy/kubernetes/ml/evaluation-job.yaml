apiVersion: batch/v1
kind: Job
metadata:
  name: risk-model-evaluation-job
  namespace: risk-engine
  labels:
    app.kubernetes.io/name: risk-eval-job
    app.kubernetes.io/part-of: ai-risk-manager
    app.kubernetes.io/component: mlops-eval
spec:
  ttlSecondsAfterFinished: 1800
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-eval-job
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: evaluator
          image: risk-ml-service:latest
          command: ["python", "-m", "training.evaluate_candidate"]
          env:
            - name: MODEL_PATH
              value: "/app/artifacts/candidates/fraud-xgb-25f-candidate-v1/model.onnx"
            - name: TEST_DATASET_PATH
              value: "/app/data/validation_features.parquet"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: artifacts-volume
              mountPath: /app/artifacts
      volumes:
        - name: artifacts-volume
          emptyDir: {}
