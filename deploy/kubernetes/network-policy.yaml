apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-backend-netpol
  namespace: risk-engine
  labels:
    app.kubernetes.io/name: risk-backend
    app.kubernetes.io/part-of: ai-risk-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: risk-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic to port 8080 from ingress-controller or internal pods
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow egress to ML inference service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: risk-ml-service
      ports:
        - protocol: TCP
          port: 8000
    # Allow egress to ClickHouse
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 9000
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
