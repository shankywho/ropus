version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ropus-risk-engine-prod
    restart: always
    environment:
      - PORT=8080
      - REDIS_URL=redis:6379
      - POSTGRES_URL=postgres://ropus_user:ropus_secure_pass_2026@postgres:5432/ropus_db?sslmode=disable
      - ML_SERVICE_URL=http://ml-service:5001
      - DEMO_MODE=true
      - JWT_SECRET=ropus_prod_jwt_super_secret_key_2026
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - ml-service

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ropus-analyst-console-prod
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: ropus-ml-service-prod
    restart: always
    environment:
      - PORT=5001
    ports:
      - "5001:5001"

  postgres:
    image: postgres:16-alpine
    container_name: ropus-postgres-prod
    restart: always
    environment:
      - POSTGRES_USER=ropus_user
      - POSTGRES_PASSWORD=ropus_secure_pass_2026
      - POSTGRES_DB=ropus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ropus-redis-prod
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
