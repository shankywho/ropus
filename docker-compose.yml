version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: risk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risk_password}
      POSTGRES_DB: ${POSTGRES_DB:-risk_engine}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risk_user} -d ${POSTGRES_DB:-risk_engine}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - risk_network

  redis:
    image: redis:7-alpine
    container_name: risk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - risk_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  risk_network:
    driver: bridge
